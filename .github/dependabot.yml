version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    groups:
      tauri:
        patterns: ["tauri*", "wry", "tao"]
      objc2:
        patterns: ["objc2*", "block2"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
